name: ComposeMultiplatform CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
          distribution: 'adopt'
          java-version: '21'
          cache: 'gradle'

    - name: Test Common
      run: make testCommon
    - name: Build Desktop
      run: make buildDesktop
    - name: Build Web
      run: make buildWeb
