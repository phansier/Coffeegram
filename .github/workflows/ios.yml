name: iOS Multiplatform CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v5.6.0
      with:
          distribution: 'adopt'
          java-version: '21'
          cache: 'gradle'

    - name: Build iOS
      run: make buildIos
