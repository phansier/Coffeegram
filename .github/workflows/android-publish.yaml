name: Android to GPlay Publish Release
on:
    push:
        branches:
            - develop
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: android-publish
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    fetch-tags: true

            -   name: set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: 'adopt'
                    java-version: '21'

            -   name: Gradle Setup
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-cleanup: on-success
                    cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

            -   name: Cache KMP tooling
                uses: actions/cache@v5
                with:
                    path: |
                        ~/.konan
                    key: ${{ runner.os }}-v1-${{ hashFiles('*.versions.toml') }}

            -   name: Configure Keystore
                run: |
                    echo '${{ secrets.KEYSTORE_FILE }}'> release.keystore.asc
                    gpg -d --passphrase '${{ secrets.KEYSTORE_PASSPHRASE }}' --batch release.keystore.asc > download.jks
                    echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
                    echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
                    echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
                env:
                    KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
                    KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
                    KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
            -   name: Create Google Play Config file
                run: |
                    echo "$PLAY_CONFIG_JSON" > play_config.json.b64
                    base64 -d -i play_config.json.b64 > play_config.json
                env:
                    PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG }}

            -   name: Create Google Maps Config file
                run: |
                    echo "MAPS_API_KEY=$MAP_KEY" >> secrets.properties
                env:
                    MAP_KEY: ${{ secrets.MAP_KEY }}

            -   name: Bump patch version and tag
                run: |
                    set -euo pipefail
                    latest=$(git tag --list 'v*-android' --sort=-v:refname | head -n1)
                    core="${latest#v}"; core="${core%-android}"
                    IFS=. read -r MA MI PA <<< "$core"
                    next="v${MA}.${MI}.$((PA + 1))-android"
                    git config user.name  "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git tag -a "$next" -m "Release $next"
                    git push origin "$next"

            -   name: Build signed release bundles
                run: ./gradlew :app:bundleRelease :wear:bundleRelease

            -   name: Upload signed bundles
                uses: actions/upload-artifact@v4
                with:
                    name: release-bundles
                    path: |
                        app/build/outputs/bundle/release/app-release.aab
                        wear/build/outputs/bundle/release/wear-release.aab
                    if-no-files-found: error

            -   name: Distribute phone + wear to Alpha track (single release)
                # Both bundles publish into one shared Play edit (commit.set(false) in the
                # build files), committed once via the shared commit task. They must run in a
                # single Gradle invocation, otherwise each would open its own edit. The bundle
                # tasks above already produced the artifacts, so these reuse them (up-to-date).
                run: >-
                    ./gradlew
                    :app:publishBundle :wear:publishBundle
                    :commitEditForRuDotBeryukhovDotCoffeegram
