name: iOS Multiplatform CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

    - name: Cache Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

    - name: Link Swift Export
      run: make linkSwiftExport

    - name: Build iOS
      run: make buildIos
